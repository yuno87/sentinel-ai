<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6677"/></marker></defs><rect width="860" height="600" fill="#ffffff"/><text x="430.0" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1c2230">Prompt workflow: 5 prompts, with code between them</text><rect x="320" y="50" width="220" height="46" rx="8" fill="#fff6e0" stroke="#b08800" stroke-width="1.6"/><text x="430.0" y="69.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2230">System prompt under test</text><text x="430.0" y="86.05" text-anchor="middle" font-size="12" font-weight="400" fill="#3d4554">pasted by the user</text><line x1="430" y1="96" x2="430" y2="120" stroke="#5d6677" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="300" y="120" width="260" height="50" rx="8" fill="#e8eefc" stroke="#3b5bdb" stroke-width="1.6"/><text x="430.0" y="141.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2230">P1 Analyse</text><text x="430.0" y="158.05" text-anchor="middle" font-size="12" font-weight="400" fill="#3d4554">purpose, rules R1..Rn, assets, weak spots</text><line x1="430" y1="170" x2="430" y2="194" stroke="#5d6677" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="300" y="194" width="260" height="50" rx="8" fill="#e8eefc" stroke="#3b5bdb" stroke-width="1.6"/><text x="430.0" y="215.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2230">P2 Write attacks</text><text x="430.0" y="232.05" text-anchor="middle" font-size="12" font-weight="400" fill="#3d4554">4 categories, safety rules</text><line x1="430" y1="244" x2="430" y2="268" stroke="#5d6677" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="280" y="268" width="300" height="44" rx="8" fill="#eef7ee" stroke="#2b8a3e" stroke-width="1.6"/><text x="430.0" y="294.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1c2230">Code: assign IDs (INJ-01...), safety screen</text><path d="M 360 312 L 200 352" fill="none" stroke="#5d6677" stroke-width="1.6" marker-end="url(#arrow)"/><text x="255" y="326" text-anchor="middle" font-size="11.5" fill="#3d4554">predicted mode</text><path d="M 500 312 L 660 352" fill="none" stroke="#5d6677" stroke-width="1.6" marker-end="url(#arrow)"/><text x="610" y="326" text-anchor="middle" font-size="11.5" fill="#3d4554">live mode</text><rect x="80" y="352" width="240" height="50" rx="8" fill="#e8eefc" stroke="#3b5bdb" stroke-width="1.6"/><text x="200.0" y="373.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2230">P3 Predict reply</text><text x="200.0" y="390.05" text-anchor="middle" font-size="12" font-weight="400" fill="#3d4554">labelled as a prediction</text><rect x="540" y="352" width="240" height="50" rx="8" fill="#f3f0fa" stroke="#6741d9" stroke-width="1.6"/><text x="660.0" y="373.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2230">Your real chatbot</text><text x="660.0" y="390.05" text-anchor="middle" font-size="12" font-weight="400" fill="#3d4554">HTTP request, real reply</text><path d="M 200 402 L 360 440" fill="none" stroke="#5d6677" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 660 402 L 500 440" fill="none" stroke="#5d6677" stroke-width="1.6" marker-end="url(#arrow)"/><text x="430" y="432" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3d4554">for each attack</text><rect x="300" y="440" width="260" height="50" rx="8" fill="#e8eefc" stroke="#3b5bdb" stroke-width="1.6"/><text x="430.0" y="461.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2230">P4 Judge (separate call)</text><text x="430.0" y="478.05" text-anchor="middle" font-size="12" font-weight="400" fill="#3d4554">Pass/Fail, severity, reason, evidence</text><line x1="430" y1="490" x2="430" y2="514" stroke="#5d6677" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="250" y="514" width="360" height="44" rx="8" fill="#eef7ee" stroke="#2b8a3e" stroke-width="1.6"/><text x="430.0" y="540.55" text-anchor="middle" font-size="13" font-weight="400" fill="#1c2230">Code: check evidence quote, launch call</text><path d="M 610 536 L 700 536 L 700 470" fill="none" stroke="#5d6677" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="620" y="430" width="200" height="40" rx="8" fill="#e8eefc" stroke="#3b5bdb" stroke-width="1.6"/><text x="720.0" y="446.05" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2230">P5 Harden</text><text x="720.0" y="463.05" text-anchor="middle" font-size="12" font-weight="400" fill="#3d4554">fixes + new prompt</text><path d="M 720 430 L 720 290 L 582 290" fill="none" stroke="#5d6677" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="790" y="322" text-anchor="middle" font-size="11.5" fill="#3d4554">re-test: same attacks,</text><text x="790" y="337" text-anchor="middle" font-size="11.5" font-weight="400" fill="#3d4554">hardened prompt</text><rect x="20" y="572" width="16" height="16" rx="3" fill="#e8eefc" stroke="#3b5bdb"/><text x="42" y="584.5" text-anchor="start" font-size="12" font-weight="400" fill="#3d4554">AI prompt (LLM call)</text><rect x="210" y="572" width="16" height="16" rx="3" fill="#eef7ee" stroke="#2b8a3e"/><text x="232" y="584.5" text-anchor="start" font-size="12" font-weight="400" fill="#3d4554">Plain code (no AI)</text><rect x="400" y="572" width="16" height="16" rx="3" fill="#fff6e0" stroke="#b08800"/><text x="422" y="584.5" text-anchor="start" font-size="12" font-weight="400" fill="#3d4554">Input / output</text><rect x="590" y="572" width="16" height="16" rx="3" fill="#f3f0fa" stroke="#6741d9"/><text x="612" y="584.5" text-anchor="start" font-size="12" font-weight="400" fill="#3d4554">External system</text></svg>
